name: Build, Test & Release macOS App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    name: Build Universal App, Run Tests & Package Assets
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run C/IOKit Bridge, Swift Core Engine & CLI Test Suite
        run: |
          chmod +x build_and_install.sh tests/run_tests.sh
          ./build_and_install.sh --test

      - name: Build Universal App & Package Release Assets
        run: |
          ./build_and_install.sh --package

      - name: Verify Exported Architecture Binaries (arm64, x86_64, Universal)
        run: |
          echo "=== Standalone CLI Architecture Verification ==="
          file dist/disk-health-arm64 && lipo -info dist/disk-health-arm64
          file dist/disk-health-x86_64 && lipo -info dist/disk-health-x86_64
          file dist/disk-health-universal && lipo -info dist/disk-health-universal
          echo "=== Bundled Binary Verification ==="
          file DiskHealthMonitor.app/Contents/MacOS/DiskHealthMonitor
          lipo -info DiskHealthMonitor.app/Contents/MacOS/DiskHealthMonitor
          echo "=== Exported Release Assets Check ==="
          ls -lh dist/

      - name: Upload Build Artifacts (ZIP, DMG & SHA256SUMS)
        uses: actions/upload-artifact@v4
        with:
          name: DiskHealthMonitor-macOS-Universal
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release Assets
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Universal Disk Health Monitor ${{ github.ref_name }} (macOS arm64 / x86_64 / Universal)
          body: |
            ### Universal Disk Health Monitor Release
            Download the appropriate asset for your Mac architecture:
            - **Apple Silicon (M1/M2/M3/M4)**: `DiskHealthMonitor-macOS-arm64.dmg` or `DiskHealthMonitor-macOS-arm64.zip` (CLI: `disk-health-arm64`)
            - **Intel Macs (x86_64)**: `DiskHealthMonitor-macOS-x86_64.dmg` or `DiskHealthMonitor-macOS-x86_64.zip` (CLI: `disk-health-x86_64`)
            - **Universal (All Macs)**: `DiskHealthMonitor-macOS-universal.dmg` or `DiskHealthMonitor-macOS-universal.zip` (CLI: `disk-health-universal`)

            All SHA-256 checksums are verified in `SHA256SUMS.txt`.
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: dist/*
